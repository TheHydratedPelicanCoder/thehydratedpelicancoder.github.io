<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Glory Yusuf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #191919;
            color: #e6e6e6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(74, 144, 226, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(91, 163, 245, 0.1) 0%, transparent 50%);
        }
        
        .contact-card {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(135deg, #2d2d2d, #3a3a3a);
            border-radius: 25px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(74, 144, 226, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .contact-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4a90e2, #5ba3f5, #4a90e2);
            background-size: 200% 100%;
            animation: gradientShift 3s ease-in-out infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes pulseGlowContact {
            0%, 100% { box-shadow: 0 8px 25px var(--glow-color-start); }
            50% { box-shadow: 0 10px 35px var(--glow-color-end); }
        }
        
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #4a90e2, #357abd);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            border: 4px solid rgba(74, 144, 226, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .profile-img svg {
            width: 50%;
            height: 50%;
            color: #e6e6e6;
        }
        
        .profile-img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.4);
        }
        
        .contact-card h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #4a90e2, #5ba3f5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent; /* Use color: transparent as a fallback */
            -webkit-text-fill-color: transparent;
        }
        
        .job-title {
            color: #b3b3b3;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            font-weight: 500;
        }
        
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            background: rgba(74, 144, 226, 0.1);
            border: 1px solid rgba(74, 144, 226, 0.3);
            border-radius: 15px;
            color: #e6e6e6;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        
        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(74, 144, 226, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .social-link:hover::before {
            left: 100%;
        }
        
        .social-link:hover {
            transform: translateY(-2px);
            animation: pulseGlowContact 2s infinite ease-in-out;
        }
        
        .linkedin-link:hover {
            --glow-color-start: rgba(0, 119, 181, 0.3);
            --glow-color-end: rgba(0, 119, 181, 0.5);
            background: rgba(0, 119, 181, 0.15);
            border-color: rgba(0, 119, 181, 0.5);
        }
        
        .twitter-link:hover {
            --glow-color-start: rgba(29, 161, 242, 0.3);
            --glow-color-end: rgba(29, 161, 242, 0.5);
            background: rgba(29, 161, 242, 0.15);
            border-color: rgba(29, 161, 242, 0.5);
        }
        
        .email-link:hover {
            --glow-color-start: rgba(16, 185, 129, 0.3);
            --glow-color-end: rgba(16, 185, 129, 0.5);
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.5);
        }
        
        .calendly-link:hover {
            --glow-color-start: rgba(0, 107, 255, 0.3);
            --glow-color-end: rgba(0, 107, 255, 0.5);
            background: rgba(0, 107, 255, 0.15);
            border-color: rgba(0, 107, 255, 0.5);
        }
        
        .social-link svg {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .back-link {
            color: #b3b3b3;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .back-link:hover {
            color: #4a90e2;
        }
        
        .contact-note {
            background: rgba(74, 144, 226, 0.1);
            border: 1px solid rgba(74, 144, 226, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            font-style: italic;
            color: #c9c9c9;
            line-height: 1.6;
        }
        
        @media (max-width: 480px) {
            .contact-card {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }
            
            .contact-card h1 {
                font-size: 2rem;
            }
            
            .profile-img {
                width: 100px;
                height: 100px;
            }
            
            .social-link {
                padding: 0.9rem 1.2rem;
            }
            
            .social-links {
                gap: 0.8rem;
            }
        }
        
        @media (max-width: 360px) {
            .contact-card h1 {
                font-size: 1.8rem;
            }
            
            .social-link {
                font-size: 0.9rem;
                padding: 0.8rem 1rem;
            }
            
            .social-link svg {
                width: 20px;
                height: 20px;
                margin-right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contact-card">
        <!-- Profile Picture -->
        <div class="profile-img">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        </div>

        <!-- Name and Title -->
        <h1>Glory Yusuf</h1>
        <p class="job-title">DevOps Engineer</p>

        <!-- Contact Note -->
        <div class="contact-note">
            🚀 Ready to collaborate on exciting DevOps projects! Let's build something amazing together.
        </div>

        <!-- Social Links -->
        <div class="social-links">
            <!-- LinkedIn -->
            <a href="https://linkedin.com/in/gloryyusuf" target="_blank" class="social-link linkedin-link">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"></path>
                </svg>
                Connect on LinkedIn
            </a>

            <!-- Twitter -->
            <a href="https://x.com/gloryyusuf52" target="_blank" class="social-link twitter-link">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
                </svg>
                Follow on Twitter
            </a>

            <!-- Email -->
            <a href="mailto:gloryyusuf20@gmail.com" class="social-link email-link">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                Send an Email
            </a>

            <!-- Calendly -->
            <a href="https://calendly.com/your-username" target="_blank" class="social-link calendly-link">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                Schedule a Meeting
            </a>
        </div>
        
        <!-- Back Link -->
        <div>
            <!-- The onclick is removed for a more reliable fallback -->
            <a href="index.html" class="back-link">
                ← Back to Portfolio
            </a>
        </div>
    </div>

    <script>
        // Add smooth entrance animation
        document.addEventListener('DOMContentLoaded', function() {
            const card = document.querySelector('.contact-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
            
            // Add staggered animation to social links
            const links = document.querySelectorAll('.social-link');
            links.forEach((link, index) => {
                link.style.opacity = '0';
                link.style.transform = 'translateX(-20px)';
                link.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                
                setTimeout(() => {
                    link.style.opacity = '1';
                    link.style.transform = 'translateX(0)';
                }, 300 + (index * 100));
            });
        });

        // Add click tracking for analytics (optional)
        document.querySelectorAll('.social-link').forEach(link => {
            link.addEventListener('click', function(e) {
                // Note: this.textContent might include extra whitespace. .trim() cleans it.
                const platform = this.textContent.trim();
                console.log(`Clicked: ${platform}`);
                // You can add analytics tracking here
            });
        });
    </script>
</body>

</html>
